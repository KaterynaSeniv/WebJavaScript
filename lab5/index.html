<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Square Hunter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Square Hunter</h1>

<div id="menu" class="card">
    <select id="mode">
        <option value="">Режим</option>
        <option value="normal">Звичайний</option>
        <option value="challenge">Challenge Day</option>
    </select>

    <select id="difficulty">
        <option value="">Складність</option>
        <option value="easy">Легка</option>
        <option value="medium">Середня</option>
        <option value="hard">Важка</option>
    </select>

    <input type="color" id="colorPicker">

    <p class="hint">⚠️ У Challenge режимі не рекомендується обирати червоний</p>

    <button id="startBtn" disabled>Start</button>
</div>

<div id="game" class="card hidden">
    <div class="info">
        <span>Очки: <b id="score">0</b></span>
        <span>Час: <b id="time">0</b></span>
    </div>

    <div id="field">
        <div id="square"></div>
    </div>
</div>

<div id="end" class="card hidden">
    <h2>Game Over</h2>
    <p>Очки: <span id="final"></span></p>
    <button id="again">Ще раз</button>
    <button id="back">Меню</button>
</div>

<script src="script.js"></script>
</body>
</html>
