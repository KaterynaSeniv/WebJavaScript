<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeless Radiance | AURUM</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="nav-container">
            <div class="logo">AURUM</div>
            
            <button class="hamburger" id="hamburger" aria-label="Відкрити меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <ul class="nav-menu" id="nav-menu">
                <li><a href="#">Колекції</a></li>
                <li><a href="#">Персні</a></li>
                <li><a href="#">Сережки</a></li>
                <li><a href="#">Підвіски</a></li>
                <li><a href="#">Браслети</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="carousel-container">
            <div class="carousel-track" id="carousel-track"></div>
            
            <button class="carousel-btn prev" id="prevBtn" aria-label="Попередній слайд">‹</button>
            <button class="carousel-btn next" id="nextBtn" aria-label="Наступний слайд">›</button>
            
            <div class="indicators" id="indicators"></div>
        </section>

        <section class="content-grid">
            <div class="large-only grid">
                <div class="image-card">
                    <img src="images/large1.webp" alt="Перстень з діамантом">
                    <p>Golden Shine</p>
                </div>
                <div class="image-card">
                    <img src="images/larde2.webp" alt="Підвіска в червоному футлярі">
                    <p>Timeless Desire</p>
                </div>
                <div class="image-card">
                    <img src="images/large3.jpg" alt="Келих і рука з прикрасою">
                    <p>Elegant Moment</p>
                </div>
            </div>

            <div class="medium-only grid">
                <div class="image-card">
                    <img src="images/medium1.webp" alt="Сережки на червоному тлі">
                    <p>Delicate Bloom</p>
                </div>
                <div class="image-card">
                    <img src="images/medium2.jpg" alt="Сережки в серці">
                    <p>Passionate Heart</p>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
