<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURUM</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Josefin+Sans:wght@300;600&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <div class="nav">
        <div class="logo">✦ AURUM ✦</div>

        <ul class="menu" id="menu">
            <li>Home</li>
            <li>Catalog</li>
            <li>Collections</li>
            <li>About</li>
        </ul>

        <div class="hamburger" id="hamburger">
            <span></span><span></span><span></span>
        </div>
    </div>
</header>

<section class="carousel">
    <div class="track" id="track"></div>

    <button class="btn prev" id="prev">‹</button>
    <button class="btn next" id="next">›</button>

    <div class="dots" id="dots"></div>
</section>

<section class="collections large-only">
    <h2>Collections</h2>

    <div class="grid">
        <img src="images/large1.webp">
        <img src="images/larde2.webp">
        <img src="images/large3.jpg">
    </div>
</section>

<section class="collections medium-only">
    <div class="grid">
        <img src="images/medium1.webp">
        <img src="images/medium2.jpg">
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
