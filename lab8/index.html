<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeless Radiance | AURUM</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="nav-container">
            <div class="logo">AURUM</div>
            <button class="hamburger" id="hamburger" aria-label="Меню">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="#">Collections</a></li>
                <li><a href="#">Rings</a></li>
                <li><a href="#">Earrings</a></li>
                <li><a href="#">Suspensions</a></li>
                <li><a href="#">Bracelets</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="carousel-container">
            <div class="carousel-track" id="carousel-track"></div>
            <button class="carousel-btn prev" id="prevBtn">‹</button>
            <button class="carousel-btn next" id="nextBtn">›</button>
            <div class="indicators" id="indicators"></div>
        </section>

        <section class="collections-section">
            <div class="section-header">
                <h2>Timeless Radiance</h2>
                <p class="subtitle">What makes you special, no matter the day, every minute</p>
            </div>
            
            <div class="collections-grid">
                <div class="collection-card">
                    <img src="images/large1.webp" alt="Golden Shine">
                    <div class="card-overlay">
                        <h3>Golden Shine</h3>
                    </div>
                </div>
                <div class="collection-card">
                    <img src="images/larde2.webp" alt="Timeless Desire">
                    <div class="card-overlay">
                        <h3>Timeless Desire</h3>
                    </div>
                </div>
                <div class="collection-card">
                    <img src="images/large3.jpg" alt="Elegant Moment">
                    <div class="card-overlay">
                        <h3>Elegant Moment</h3>
                    </div>
                </div>
            </div>
        </section>

        <section class="content-grid">
            <div class="medium-only grid">
                <div class="image-card">
                    <img src="images/medium1.webp" alt="Delicate Bloom">
                    <p>Delicate Bloom</p>
                </div>
                <div class="image-card">
                    <img src="images/medium2.jpg" alt="Passionate Heart">
                    <p>Passionate Heart</p>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
