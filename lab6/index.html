<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Lights Out</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Lights Out</h1>

<div class="info">
  <p>Час: <span id="time">0</span> сек</p>
  <p>Ходи: <span id="moves">0</span></p>
  <p>Мінімум: <span id="minSteps">0</span></p>
</div>

<div id="board"></div>

<div class="buttons">
  <button onclick="newGame()">New Game</button>
  <button onclick="restartGame()">Restart</button>
  <button onclick="showHint()">Hint</button>
</div>

<div id="winMessage" class="hidden">
  <h2>🎉 Перемога!</h2>
  <p>Час: <span id="finalTime"></span> сек</p>
  <p>Ходи: <span id="finalMoves"></span></p>
  <button onclick="newGame()">Нова гра</button>
</div>

<script src="script.js"></script>
</body>
</html>
